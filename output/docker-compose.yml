version: '3.8'

services:
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:80" # Map host port 3000 to container port 80 (Nginx)
    environment:
      - REACT_APP_API_URL=http://server:4000 # Point to the backend service
    networks:
      - app-network
    depends_on:
      server:
        condition: service_healthy # Ensure backend is healthy before starting frontend
    restart: unless-stopped

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "4000:4000" # Expose backend on host port 4000
    environment:
      - NODE_ENV=production
      # Add any other backend specific environment variables here, e.g., database connection strings if applicable.
    networks:
      - app-network
    # Health check is defined in the Dockerfile for this service.
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

# No volumes are defined as there are no datastores in the project structure provided.
# If the Node.js server needed persistent storage for files, named volumes would be defined here.