[project]
name = "orchai"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "click>=8.1",
  "rich>=13.7",
  "python-dotenv>=1.0",
]

[project.scripts]
orchai = "cli.orchai:cli"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "core*"]
exclude = ["templates*", "tests*", "venv*", "dist*", "build*"]

[tool.setuptools]
include-package-data = true
