version: '3.8'

services:
  nextjs-template:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

networks:
  app-network:
    driver: bridge

volumes:
  # No specific named volumes are required for this Next.js application based on the provided structure.
  # If persistent storage was needed (e.g., for user uploads), volumes would be defined here.